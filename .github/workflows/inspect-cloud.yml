name: 클라우드 초기 점검

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-cloud
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/codex/initial-homepage'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_REF: xmsyxbqajlwekgmjyall
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      VERCEL_PROJECT_ID: prj_wAGW1fL7hmEBI3jhd4jfAeWp5ZsU
      VERCEL_ORG_ID: team_T9ygNwk03w2bBwkZ6SANhi0j
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Secret 등록 확인
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD VERCEL_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name Secret이 비어 있습니다."
              exit 1
            fi
          done

      - name: Vercel 프로젝트 접근 확인
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url = new URL(`https://api.vercel.com/v9/projects/${process.env.VERCEL_PROJECT_ID}`);
          url.searchParams.set('teamId', process.env.VERCEL_ORG_ID);
          const response = await fetch(url, {
            headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` },
            redirect: 'error',
            signal: AbortSignal.timeout(30000),
          });
          if (!response.ok) {
            console.error(`Vercel 프로젝트 접근 실패 (HTTP ${response.status}).`);
            process.exit(1);
          }
          const project = await response.json();
          if (project.id !== process.env.VERCEL_PROJECT_ID) {
            console.error('Vercel 프로젝트가 설정과 일치하지 않습니다.');
            process.exit(1);
          }
          console.log('Vercel 프로젝트 접근 확인 완료.');
          NODE

      - name: Supabase CLI 준비
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/supabase-cli" --no-save --package-lock=false supabase@2.118.0
          echo "$RUNNER_TEMP/supabase-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: 운영 DB 연결 확인
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch(`https://api.supabase.com/v1/projects/${process.env.SUPABASE_PROJECT_REF}/config/database/pooler`, {
            headers: { Authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}` },
            redirect: 'error',
            signal: AbortSignal.timeout(30000),
          });
          if (!response.ok) {
            console.error(`Supabase IPv4 연결 설정 조회 실패 (HTTP ${response.status}).`);
            if (response.status === 403) console.error('Supabase 액세스 토큰의 Connection Pooling → Read 권한을 확인해주세요.');
            process.exit(1);
          }
          console.log('Supabase IPv4 연결 설정 접근 확인 완료.');
          NODE
          supabase init --yes
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes

      - name: 현재 스키마와 적용 이력 읽기
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cloud-inspection"
          supabase db dump --linked --project-ref "$SUPABASE_PROJECT_REF" --schema public --file "$RUNNER_TEMP/cloud-inspection/public-schema.sql"
          supabase migration list --linked > "$RUNNER_TEMP/cloud-inspection/migration-history.txt"

      - name: 점검 자료 저장
        uses: actions/upload-artifact@v4
        with:
          name: cloud-schema-inspection
          path: ${{ runner.temp }}/cloud-inspection/
          if-no-files-found: error
          retention-days: 3
