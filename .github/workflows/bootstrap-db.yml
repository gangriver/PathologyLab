name: 기존 DB 적용 이력 등록

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-cloud
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/codex/initial-homepage'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Supabase CLI 준비
        run: |
          npm install --prefix "$RUNNER_TEMP/supabase-cli" --no-save --package-lock=false supabase@2.118.0
          echo "$RUNNER_TEMP/supabase-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: 스키마 일치 확인 후 적용 이력만 등록
        env:
          SUPABASE_PROJECT_REF: xmsyxbqajlwekgmjyall
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          : "${SUPABASE_ACCESS_TOKEN:?Supabase 토큰이 필요합니다.}"
          : "${SUPABASE_DB_PASSWORD:?DB 비밀번호가 필요합니다.}"
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes
          supabase db dump --linked --project-ref "$SUPABASE_PROJECT_REF" --schema public --file "$RUNNER_TEMP/current-schema.sql"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, readdirSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';

          let stage = '기준 스키마 비교';
          try {
            const version = '20260930000000';
            const filename = `${version}_baseline.sql`;
            assert.deepEqual(readdirSync('supabase/migrations').filter(name => name.endsWith('.sql')), [filename]);
            const normalize = text => text.replaceAll('\r\n', '\n').trim();
            const expected = normalize(readFileSync(`supabase/migrations/${filename}`, 'utf8'));
            const current = normalize(readFileSync(`${process.env.RUNNER_TEMP}/current-schema.sql`, 'utf8'));
            assert.ok(expected.length > 0);
            assert.equal(current, expected, '현재 DB 구조가 검토한 기준과 다릅니다.');

            stage = 'DB 연결 주소 확인';
            const url = new URL(readFileSync('supabase/.temp/pooler-url', 'utf8').trim());
            assert.ok(['postgres:', 'postgresql:'].includes(url.protocol));
            assert.ok(url.hostname.endsWith('.pooler.supabase.com'));
            assert.equal(url.username, `postgres.${process.env.SUPABASE_PROJECT_REF}`);
            assert.equal(url.pathname, '/postgres');
            assert.equal(url.password, '', '연결 주소에 비밀번호를 포함할 수 없습니다.');
            for (const key of ['password', 'service', 'passfile']) assert.equal(url.searchParams.has(key), false);
            url.password = '';
            const pooler = url.toString();
            const options = { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'], env: { ...process.env, PGPASSWORD: process.env.SUPABASE_DB_PASSWORD } };
            const query = sql => JSON.parse(execFileSync('supabase', ['db', 'query', '--db-url', pooler, '--output', 'json', '--agent', 'no', sql], options));
            const history = () => {
              const result = query("SELECT to_regclass('supabase_migrations.schema_migrations') IS NOT NULL AS present");
              assert.ok(Array.isArray(result) && result.length === 1 && typeof result[0].present === 'boolean');
              return result[0].present ? query('SELECT version FROM supabase_migrations.schema_migrations ORDER BY version') : [];
            };
            stage = '기존 적용 이력 조회';
            const before = history();
            assert.ok(Array.isArray(before));
            if (before.length === 0) {
              stage = '기준 적용 이력 등록';
              execFileSync('supabase', ['migration', 'repair', version, '--status', 'applied', '--linked'], options);
            } else {
              assert.deepEqual(before, [{ version }], '알 수 없는 적용 이력이 있습니다.');
            }
            stage = '등록 결과 확인';
            assert.deepEqual(history(), [{ version }]);
            console.log('기존 스키마와 일치하며 기준 적용 이력 등록을 확인했습니다. 앱 테이블에는 SQL을 실행하지 않았습니다.');
          } catch {
            console.error(`${stage} 단계에서 중단됐습니다. 기준 이력 등록이 완료됐는지 확인해주세요.`);
            process.exitCode = 1;
          }
          NODE
